services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Mở quyền đọc công khai cho ba bucket để player lấy được HLS, thumbnail và audio.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 2; done;
      mc mb -p local/tiktak-videos local/tiktak-thumbnails local/tiktak-audio;
      mc anonymous set download local/tiktak-videos;
      mc anonymous set download local/tiktak-thumbnails;
      mc anonymous set download local/tiktak-audio;
      echo 'Bucket da san sang';
      "

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_INTERNAL_KEY: ${INTERNAL_KEY:-internal_secret_key}
      AI_WHISPER_MODEL: ${AI_WHISPER_MODEL:-small}
      AI_MODEL_CACHE_DIR: /models
    ports:
      - "8002:8002"
    volumes:
      - ai-models:/models

volumes:
  mongo-data:
  redis-data:
  minio-data:
  ai-models:
